name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile implementation
        run: python -m py_compile neural_network.py

      - name: Validate demonstration notebook
        run: python -c "import json; json.load(open('parkinsons_demo.ipynb', encoding='utf-8'))"

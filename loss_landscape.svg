<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500" role="img" aria-labelledby="title desc">
  <title id="title">Loss landscape with hills, valleys, contours, and gradient descent</title>
  <desc id="desc">A stylized three-dimensional loss surface with hills and a valley. The gradient points uphill while the negative gradient points downhill toward a minimum.</desc>
  <defs>
    <linearGradient id="terrain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7c98b"/>
      <stop offset="0.48" stop-color="#e9a66b"/>
      <stop offset="1" stop-color="#74b89c"/>
    </linearGradient>
    <marker id="axis-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151"/>
    </marker>
    <marker id="gradient-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#dc2626"/>
    </marker>
    <marker id="descent-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#16803c"/>
    </marker>
  </defs>
  <rect width="760" height="500" fill="#ffffff"/>
  <text x="380" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#1f2937">Loss landscape</text>
  <text x="380" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#4b5563">Hills are high-loss regions; valleys are low-loss regions</text>

  <line x1="100" y1="405" x2="685" y2="405" stroke="#374151" stroke-width="2" marker-end="url(#axis-arrow)"/>
  <line x1="100" y1="405" x2="100" y2="95" stroke="#374151" stroke-width="2" marker-end="url(#axis-arrow)"/>
  <text x="685" y="432" text-anchor="end" font-family="Arial, sans-serif" font-size="15" fill="#374151">weight 1</text>
  <text x="65" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#374151" transform="rotate(-90 65 105)">weight 2</text>
  <text x="122" y="88" font-family="Arial, sans-serif" font-size="15" fill="#374151">loss</text>

  <!-- Stylized surface: a high hill on the left, a high hill on the right, and a low valley between them. -->
  <path d="M105 350 C150 300 150 165 220 125 C275 92 305 205 340 260 C375 315 420 305 455 255 C505 180 535 95 610 130 C665 156 650 285 690 350 L690 405 L105 405 Z" fill="url(#terrain)" stroke="#6b7280" stroke-width="2"/>
  <path d="M130 338 C175 285 175 190 225 158 C265 133 285 220 320 275 C355 330 420 330 465 270 C510 210 545 135 595 157 C630 172 635 275 670 338" fill="none" stroke="#9a6a49" stroke-width="2" opacity="0.75"/>
  <path d="M150 350 C195 305 197 225 230 192 C258 165 273 235 307 285 C345 342 422 345 478 282 C520 235 552 172 585 181 C610 188 618 285 650 350" fill="none" stroke="#9a6a49" stroke-width="2" opacity="0.75"/>
  <path d="M174 360 C212 322 220 258 238 223 C253 198 265 250 294 294 C334 356 422 362 490 297 C527 262 555 207 577 207 C594 210 602 294 630 360" fill="none" stroke="#9a6a49" stroke-width="2" opacity="0.75"/>
  <path d="M203 371 C235 340 245 292 250 257 C256 232 270 273 290 307 C327 367 425 377 500 315 C531 289 555 244 570 242 C582 244 589 302 610 371" fill="none" stroke="#9a6a49" stroke-width="2" opacity="0.75"/>

  <text x="185" y="145" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#7c2d12">high loss</text>
  <text x="515" y="148" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#7c2d12">high loss</text>
  <text x="385" y="354" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="#166534">low-loss valley</text>

  <circle cx="395" cy="315" r="7" fill="#2563eb"/>
  <text x="405" y="309" font-family="Arial, sans-serif" font-size="15" fill="#1f2937">current weights</text>
  <line x1="395" y1="315" x2="325" y2="240" stroke="#dc2626" stroke-width="4" marker-end="url(#gradient-arrow)"/>
  <text x="230" y="235" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#dc2626">gradient: uphill</text>
  <line x1="395" y1="315" x2="450" y2="342" stroke="#16803c" stroke-width="4" marker-end="url(#descent-arrow)"/>
  <text x="455" y="365" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#16803c">−gradient: downhill</text>
</svg>

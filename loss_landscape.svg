<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470" role="img" aria-labelledby="title desc">
  <title id="title">Loss landscape with contours, gradient, and gradient descent</title>
  <desc id="desc">Elliptical loss contours surround a low-loss minimum. At the current weights, the gradient points uphill and the negative gradient points downhill toward the minimum.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#16803c"/>
    </marker>
  </defs>
  <rect width="760" height="470" fill="#ffffff"/>
  <text x="380" y="32" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#1f2937">Loss landscape</text>
  <text x="380" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#4b5563">Contours connect weights with equal loss</text>

  <line x1="95" y1="390" x2="690" y2="390" stroke="#374151" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <line x1="95" y1="390" x2="95" y2="90" stroke="#374151" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="685" y="418" text-anchor="end" font-family="Arial, sans-serif" font-size="15" fill="#374151">weight 1</text>
  <text x="62" y="102" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#374151" transform="rotate(-90 62 102)">weight 2</text>

  <g fill="none" stroke="#9ca3af" stroke-width="2">
    <ellipse cx="500" cy="275" rx="205" ry="125" transform="rotate(-25 500 275)"/>
    <ellipse cx="500" cy="275" rx="160" ry="97" transform="rotate(-25 500 275)"/>
    <ellipse cx="500" cy="275" rx="120" ry="72" transform="rotate(-25 500 275)"/>
    <ellipse cx="500" cy="275" rx="82" ry="49" transform="rotate(-25 500 275)"/>
    <ellipse cx="500" cy="275" rx="45" ry="27" transform="rotate(-25 500 275)"/>
  </g>
  <text x="610" y="160" font-family="Arial, sans-serif" font-size="14" fill="#6b7280">higher loss</text>
  <text x="493" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#374151">minimum</text>
  <circle cx="500" cy="275" r="5" fill="#16803c"/>

  <line x1="260" y1="145" x2="165" y2="82" stroke="#dc2626" stroke-width="4" marker-end="url(#arrow-red)"/>
  <text x="175" y="70" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#dc2626">gradient: steepest increase</text>
  <circle cx="260" cy="145" r="7" fill="#2563eb"/>
  <text x="270" y="142" font-family="Arial, sans-serif" font-size="15" fill="#1f2937">current weights</text>

  <line x1="260" y1="145" x2="470" y2="263" stroke="#16803c" stroke-width="4" marker-end="url(#arrow-green)"/>
  <text x="320" y="205" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#16803c">−gradient: descent step</text>
</svg>

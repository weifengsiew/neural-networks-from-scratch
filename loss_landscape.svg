<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470" role="img" aria-labelledby="title desc">
  <title id="title">Loss landscape with concentric contours and gradient descent</title>
  <desc id="desc">Concentric loss contours surround a minimum. The gradient points toward higher loss and the negative gradient points toward the minimum.</desc>
  <defs>
    <marker id="axis-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker>
    <marker id="gradient-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#dc2626"/></marker>
    <marker id="descent-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#16803c"/></marker>
  </defs>
  <rect width="760" height="470" fill="#ffffff"/>
  <text x="380" y="32" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#1f2937">Loss landscape</text>
  <text x="380" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#4b5563">Each contour represents the same loss value</text>

  <line x1="95" y1="390" x2="690" y2="390" stroke="#374151" stroke-width="2" marker-end="url(#axis-arrow)"/>
  <line x1="95" y1="390" x2="95" y2="90" stroke="#374151" stroke-width="2" marker-end="url(#axis-arrow)"/>
  <text x="685" y="418" text-anchor="end" font-family="Arial, sans-serif" font-size="15" fill="#374151">weight 1</text>
  <text x="62" y="102" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#374151" transform="rotate(-90 62 102)">weight 2</text>

  <g fill="none" stroke="#9ca3af" stroke-width="2">
    <circle cx="470" cy="255" r="170"/>
    <circle cx="470" cy="255" r="135"/>
    <circle cx="470" cy="255" r="102"/>
    <circle cx="470" cy="255" r="72"/>
    <circle cx="470" cy="255" r="44"/>
    <circle cx="470" cy="255" r="18"/>
  </g>
  <text x="592" y="125" font-family="Arial, sans-serif" font-size="14" fill="#6b7280">higher loss</text>
  <circle cx="470" cy="255" r="5" fill="#16803c"/>
  <text x="480" y="260" font-family="Arial, sans-serif" font-size="14" fill="#374151">minimum</text>

  <circle cx="310" cy="145" r="7" fill="#2563eb"/>
  <text x="320" y="142" font-family="Arial, sans-serif" font-size="15" fill="#1f2937">current weights</text>
  <line x1="310" y1="145" x2="205" y2="82" stroke="#dc2626" stroke-width="4" marker-end="url(#gradient-arrow)"/>
  <text x="212" y="70" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#dc2626">gradient: uphill</text>
  <line x1="310" y1="145" x2="450" y2="243" stroke="#16803c" stroke-width="4" marker-end="url(#descent-arrow)"/>
  <text x="330" y="205" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#16803c">−gradient: downhill</text>
</svg>
